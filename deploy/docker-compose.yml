# 本地一键启动：MySQL + Redis + MinIO + 后端 + 前端
#
# 用法见 deploy/README.md。前置：deploy/prepare.sh 已跑过（生成 build/app.jar 与 build/dist/）。
#
# 镜像全部走 REGISTRY 变量（默认 daocloud 公共镜像代理，因为本机到 Docker Hub 不通）。
# 能直连 Docker Hub 时：export REGISTRY=docker.io/library
# MinIO 镜像不在 library/ 命名空间，用 MINIO_IMAGE 单独覆盖（服务端镜像已自带 mc）。

name: ai-work-platform

services:
  mysql:
    image: ${REGISTRY:-docker.m.daocloud.io/library}/mysql:8.0
    container_name: awp-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: aoyou
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=1
      - --explicit_defaults_for_timestamp=true
    ports:
      # 宿主机 3306 已被本机 mysqld 占用，改映射 3307
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 数据库初始化：显式指定 utf8mb4 客户端字符集。
  # 不用镜像自带的 /docker-entrypoint-initdb.d —— 那里的 mysql 客户端按容器 locale 选字符集，
  # 默认 locale 下会选 latin1，导致中文数据触发 "Data too long for column 'nick_name'"。
  db-init:
    image: ${REGISTRY:-docker.m.daocloud.io/library}/mysql:8.0
    container_name: awp-db-init
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-root}
      # SnailJob 控制台登录账号：与 SBA 共用控制台口令变量（§5 口令来自环境变量）。
      MONITOR_ADMIN_USERNAME: ${MONITOR_ADMIN_USERNAME:?请先设置 MONITOR_ADMIN_USERNAME}
      MONITOR_ADMIN_PASSWORD: ${MONITOR_ADMIN_PASSWORD:?请先设置 MONITOR_ADMIN_PASSWORD}
    volumes:
      - ../db/migrations/sql:/sql:ro
      # SnailJob 表与平台调度组种子（SPEC-010 E-01 / A-04 / A-06）：
      # 表结构取自 platform/script/sql/ry_job.sql，组/任务种子来自 deploy/sql。
      - ../platform/script/sql/ry_job.sql:/sql-jobs/ry_job.sql:ro
      - ./sql:/sql-seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        has_table() {
          mysql --default-character-set=utf8mb4 -hmysql -uroot -N -e \
            "select 1 from information_schema.tables where table_schema='aoyou' and table_name='$$1'" | grep -q 1
        }
        if has_table sys_user; then
          echo "业务表已初始化，跳过 V*.sql"
        else
          for f in $$(ls /sql/V*.sql | sort -V); do
            echo "=> $$f"
            mysql --default-character-set=utf8mb4 -hmysql -uroot aoyou < "$$f"
          done
        fi
        # SnailJob 表：缺失即导入；导入失败（SQL 报错）会让 db-init 非 0 退出。
        if has_table sj_group_config; then
          echo "SnailJob 表已存在，跳过 ry_job.sql"
        else
          echo "=> 导入 SnailJob 表 /sql-jobs/ry_job.sql"
          mysql --default-character-set=utf8mb4 -hmysql -uroot aoyou < /sql-jobs/ry_job.sql
        fi
        # 组 aoyou_group 与测试任务种子：幂等，重建环境后可复现（E-11）。
        echo "=> 应用 SnailJob 组/任务种子 /sql-seed/snailjob-seed.sql"
        mysql --default-character-set=utf8mb4 -hmysql -uroot aoyou < /sql-seed/snailjob-seed.sql
        # SnailJob 控制台账号口令：口令只来自环境变量，经 SHA2 落库（表中不存明文）。
        # 走 stdin 而非 -e，避免口令出现在进程参数里；按唯一键 username 幂等更新。
        echo "=> 同步 SnailJob 控制台账号（口令不回显）"
        mysql --default-character-set=utf8mb4 -hmysql -uroot aoyou <<SQL
        INSERT INTO sj_system_user (username, password, role)
        VALUES ('$$MONITOR_ADMIN_USERNAME', SHA2('$$MONITOR_ADMIN_PASSWORD', 256), 2)
        ON DUPLICATE KEY UPDATE password = VALUES(password), role = 2;
        SQL
        echo "初始化完成"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  redis:
    image: ${REGISTRY:-docker.m.daocloud.io/library}/redis:7-alpine
    container_name: awp-redis
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-aoyou123}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aoyou123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 对象存储测试服务：A-07（文件管理上传/下载）与 A-08（文件配置）走真实 S3 协议。
  # 凭据与 sys_oss_config 默认项（ossConfigId=1）保持一致；仅用于本地/CI 测试栈。
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio}
    container_name: awp-minio
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aoyou}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aoyou123}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # 一次性初始化：等待 MinIO 可用 → 建桶 → 开放匿名下载（默认桶权限=public）。
  # 失败会随 compose up 暴露；重复执行由 --ignore-existing 保证幂等。
  minio-init:
    image: ${MINIO_IMAGE:-quay.io/minio/minio}
    container_name: awp-minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aoyou}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aoyou123}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set awp http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          sleep 1
        done
        mc mb --ignore-existing awp/aoyou
        mc anonymous set download awp/aoyou
        echo "MinIO bucket aoyou ready"
    depends_on:
      - minio
    restart: "no"

  # Spring Boot Admin 控制台（SPEC-010 A-01/A-02/A-03）：context-path /admin，宿主机 9090。
  # 管理员口令只从环境变量注入；compose 层缺失即报错，容器不会以空口令启动（E-03）。
  monitor-admin:
    build:
      context: .
      dockerfile: Dockerfile.monitor-admin
      args:
        REGISTRY: ${REGISTRY:-docker.m.daocloud.io/library}
    image: awp/monitor-admin:local
    container_name: awp-monitor-admin
    environment:
      TZ: Asia/Shanghai
      MONITOR_ADMIN_USERNAME: ${MONITOR_ADMIN_USERNAME:?请先设置 MONITOR_ADMIN_USERNAME}
      MONITOR_ADMIN_PASSWORD: ${MONITOR_ADMIN_PASSWORD:?请先设置 MONITOR_ADMIN_PASSWORD}
    ports:
      - "9090:9090"
    healthcheck:
      # JRE 镜像不带 curl，用 bash 的 /dev/tcp 探活；页面返回 401 也算端口就绪。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # SnailJob 调度中心（SPEC-010 A-01/A-02/A-04/A-05/A-06）：context-path /snail-job，宿主机 8800。
  snailjob-server:
    build:
      context: .
      dockerfile: Dockerfile.snailjob-server
      args:
        REGISTRY: ${REGISTRY:-docker.m.daocloud.io/library}
    image: awp/snailjob-server:local
    container_name: awp-snailjob-server
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/aoyou?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # 控制台自身也向 SBA 注册（沿用 platform 配置口径），口令同一来源。
      SPRING_BOOT_ADMIN_CLIENT_URL: http://monitor-admin:9090/admin
      SPRING_BOOT_ADMIN_CLIENT_USERNAME: ${MONITOR_ADMIN_USERNAME:?请先设置 MONITOR_ADMIN_USERNAME}
      SPRING_BOOT_ADMIN_CLIENT_PASSWORD: ${MONITOR_ADMIN_PASSWORD:?请先设置 MONITOR_ADMIN_PASSWORD}
    ports:
      - "8800:8800"
    depends_on:
      db-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8800'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        REGISTRY: ${REGISTRY:-docker.m.daocloud.io/library}
    image: awp/backend:local
    container_name: awp-backend
    environment:
      TZ: Asia/Shanghai
      # 必填，无默认值；缺失则启动失败（红线 R3）
      SA_TOKEN_JWT_SECRET: ${SA_TOKEN_JWT_SECRET:?请先 export SA_TOKEN_JWT_SECRET}
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: "jdbc:mysql://mysql:3306/aoyou?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true"
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-aoyou123}
      # SBA 客户端：开关由环境变量注入（§4），容器内部走 compose 服务名。
      SPRING_BOOT_ADMIN_CLIENT_ENABLED: ${SPRING_BOOT_ADMIN_CLIENT_ENABLED:-true}
      SPRING_BOOT_ADMIN_CLIENT_URL: http://monitor-admin:9090/admin
      SPRING_BOOT_ADMIN_CLIENT_USERNAME: ${MONITOR_ADMIN_USERNAME:?请先设置 MONITOR_ADMIN_USERNAME}
      SPRING_BOOT_ADMIN_CLIENT_PASSWORD: ${MONITOR_ADMIN_PASSWORD:?请先设置 MONITOR_ADMIN_PASSWORD}
      # A-03 要求实例名固定 aoyou-server（不依赖 spring.application.name）。
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: aoyou-server
      # SnailJob 执行器：开关由环境变量注入；组名唯一合法值 aoyou_group（§4）。
      SNAIL_JOB_ENABLED: ${SNAIL_JOB_ENABLED:-true}
      SNAIL_JOB_GROUP: aoyou_group
      SNAIL_JOB_SERVER_HOST: snailjob-server
      SNAIL_JOB_SERVER_PORT: "17888"
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      monitor-admin:
        condition: service_healthy
      snailjob-server:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REGISTRY: ${REGISTRY:-docker.m.daocloud.io/library}
    image: awp/frontend:local
    container_name: awp-frontend
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
    depends_on:
      - backend
      - monitor-admin
      - snailjob-server

volumes:
  mysql-data:
  redis-data:
  minio-data:
