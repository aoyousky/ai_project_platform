server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 production 构建里 VITE_APP_BASE_API = '/prod-api'
    # ^~ 必须保留：否则下面的静态资源正则（\.js|\.css…）会优先匹配到
    # /prod-api/warm-flow-ui/js/*.js 这类"以静态后缀结尾的接口请求"，
    # 直接吃进本地静态目录并返回 404（后端其实是 200）。
    location ^~ /prod-api/ {
        # 结尾的 / 会把 /prod-api/xxx 改写成 /xxx
        proxy_pass http://backend:8080/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接：不缓冲，超时拉长
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 外部控制台同源反代：与 .env.production 的 /admin/applications、/snail-job 对应。
    # 本地 compose 不包含这两个控制台，默认指向宿主机 9090/8800（与本机开发地址一致）；
    # 部署到其他环境时只改这里的 proxy_pass，不需要改前端代码或运行时配置。
    # ^~ 必须保留：否则静态资源正则（\.js|\.css…）会截走控制台的静态文件。
    location ^~ /admin/applications {
        proxy_pass http://host.docker.internal:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    location ^~ /snail-job {
        proxy_pass http://host.docker.internal:8800;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
