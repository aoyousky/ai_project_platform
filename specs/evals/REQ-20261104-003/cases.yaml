spec_version: "1.3"
# REQ-20261104-003（SPEC-003 角色/菜单/部门/岗位）评测用例。
#
# 预置数据由 scripts/evals/seed_spec003.sh 写入本地 Docker 测试栈；
# 执行由 scripts/evals/run_eval.py + scripts/evals/http_probe.mjs 完成
# （注入 Authorization / clientid，令牌不落盘、不打印）。
#
# 占位符：
#   ${EVAL_RUN_ID}                 本次运行唯一后缀
#   ${EVAL_SPEC003_*}              预置夹具 ID/名称（见 run_eval.py build_env 默认值）
#   ${ROLE_NEW_ID} 等              用例内 capture 捕获，后续步骤引用
cases:
  # ---------------------------------------------------------------- A-01
  - id: TC-A01
    assertion: A-01
    auth: admin
    input:
      method: GET
      path: /system/role/list
      query:
        pageNum: 1
        pageSize: 10
        roleName: ${EVAL_SPEC003_ROLE_NAME}
        status: '0'
    expect:
      status: 200
      code: 200
      total_min: 1
      rows_contains:
        roleKey: spec003_role
        roleName: ${EVAL_SPEC003_ROLE_NAME}
        status: '0'

  # ---------------------------------------------------------------- A-02
  - id: TC-A02
    assertion: A-02
    auth: admin
    input:
      method: POST
      path: /system/role
      body:
        roleName: Spec003 新建角色 ${EVAL_RUN_ID}
        roleKey: spec003_new_${EVAL_RUN_ID}
        roleSort: 1
        status: '0'
        menuIds: []
    expect:
      status: 200
      code: 200
    verify:
      - method: GET
        path: /system/role/list
        query:
          pageNum: 1
          pageSize: 10
          roleKey: spec003_new_${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          total: 1
        capture:
          ROLE_NEW_ID: rows.0.roleId
      - method: PUT
        path: /system/role
        body:
          roleId: ${ROLE_NEW_ID}
          roleName: Spec003 改名角色 ${EVAL_RUN_ID}
          roleKey: spec003_new_${EVAL_RUN_ID}
          roleSort: 1
          status: '0'
          menuIds: []
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/role/list
        query:
          pageNum: 1
          pageSize: 10
          roleKey: spec003_new_${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          total: 1
          rows_contains:
            roleName: Spec003 改名角色 ${EVAL_RUN_ID}
      - method: DELETE
        path: /system/role/${ROLE_NEW_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/role/list
        query:
          pageNum: 1
          pageSize: 10
          roleKey: spec003_new_${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          total: 0
          rows_empty: true

  # ---------------------------------------------------------------- A-03
  - id: TC-A03
    assertion: A-03
    auth: admin
    input:
      method: PUT
      path: /system/role
      body:
        roleId: ${EVAL_SPEC003_ROLE_ID}
        roleName: ${EVAL_SPEC003_ROLE_NAME}
        roleKey: spec003_role
        roleSort: 1
        status: '0'
        menuIds:
          - ${EVAL_SPEC003_DIR_MENU_ID}
          - ${EVAL_SPEC003_SUB_MENU_ID}
        # v1.1（CLAR-008）：父子联动；strict=true 时后端会把已分配菜单的父节点从 checkedKeys 剔除
        menuCheckStrictly: false
    expect:
      status: 200
      code: 200
    verify:
      - method: GET
        path: /system/menu/roleMenuTreeselect/${EVAL_SPEC003_ROLE_ID}
        expect:
          status: 200
          code: 200
          array_min:
            - path: data.menus
              min: 1
          arrays_include:
            - path: data.checkedKeys
              values:
                - ${EVAL_SPEC003_DIR_MENU_ID}
                - ${EVAL_SPEC003_SUB_MENU_ID}
      - method: PUT
        path: /system/role
        body:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          roleName: ${EVAL_SPEC003_ROLE_NAME}
          roleKey: spec003_role
          roleSort: 1
          status: '0'
          menuIds: []
          menuCheckStrictly: false
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/menu/roleMenuTreeselect/${EVAL_SPEC003_ROLE_ID}
        expect:
          status: 200
          code: 200
          arrays_empty:
            - data.checkedKeys

  # ---------------------------------------------------------------- A-04
  - id: TC-A04
    assertion: A-04
    auth: admin
    input:
      method: PUT
      path: /system/role/dataScope
      body:
        roleId: ${EVAL_SPEC003_ROLE_ID}
        dataScope: '2'
        deptIds:
          - ${EVAL_SPEC003_DEPT_ID}
        deptCheckStrictly: true
    expect:
      status: 200
      code: 200
    verify:
      - method: GET
        path: /system/role/deptTree/${EVAL_SPEC003_ROLE_ID}
        expect:
          status: 200
          code: 200
          array_min:
            - path: data.depts
              min: 1
          arrays_include:
            - path: data.checkedKeys
              values:
                - ${EVAL_SPEC003_DEPT_ID}
      - method: GET
        path: /system/role/${EVAL_SPEC003_ROLE_ID}
        expect:
          status: 200
          code: 200
          json:
            data:
              dataScope: '2'
      - method: PUT
        path: /system/role/dataScope
        body:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          dataScope: '1'
          deptIds: []
          deptCheckStrictly: true
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/role/deptTree/${EVAL_SPEC003_ROLE_ID}
        expect:
          status: 200
          code: 200
          arrays_empty:
            - data.checkedKeys
      - method: GET
        path: /system/role/${EVAL_SPEC003_ROLE_ID}
        expect:
          status: 200
          code: 200
          json:
            data:
              dataScope: '1'

  # ---------------------------------------------------------------- A-05
  - id: TC-A05
    assertion: A-05
    auth: admin
    input:
      method: PUT
      path: /system/role/authUser/selectAll
      query:
        roleId: ${EVAL_SPEC003_ROLE_ID}
        userIds: ${EVAL_SPEC003_USER_ID}
    expect:
      status: 200
      code: 200
    verify:
      - method: GET
        path: /system/role/authUser/allocatedList
        query:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          pageNum: 1
          pageSize: 10
        expect:
          status: 200
          code: 200
          total_min: 1
          rows_contains:
            userId: ${EVAL_SPEC003_USER_ID}
      - method: GET
        path: /system/role/authUser/unallocatedList
        query:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          userName: spec003_user
          pageNum: 1
          pageSize: 10
        expect:
          status: 200
          code: 200
          total: 0
      - method: PUT
        path: /system/role/authUser/cancel
        body:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          userId: ${EVAL_SPEC003_USER_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/role/authUser/allocatedList
        query:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          pageNum: 1
          pageSize: 10
        expect:
          status: 200
          code: 200
          rows_not_contains:
            userId: ${EVAL_SPEC003_USER_ID}
      # 同一请求参数重复提交会被后端 @RepeatSubmit（默认 5s）拦截，先等窗口过去
      - wait: 5500
      - method: PUT
        path: /system/role/authUser/selectAll
        query:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          userIds: ${EVAL_SPEC003_USER_ID}
        expect:
          status: 200
          code: 200
      - method: PUT
        path: /system/role/authUser/cancelAll
        query:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          userIds: ${EVAL_SPEC003_USER_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/role/authUser/allocatedList
        query:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          pageNum: 1
          pageSize: 10
        expect:
          status: 200
          code: 200
          total: 0
          rows_empty: true

  # ---------------------------------------------------------------- A-06
  - id: TC-A06
    assertion: A-06
    auth: admin
    input:
      method: DELETE
      path: /system/role/1
    expect:
      status: 200
      code_not: 200
      msg_nonempty: true
    verify:
      - method: PUT
        path: /system/role/changeStatus
        body:
          roleId: 1
          status: '1'
        expect:
          status: 200
          code_not: 200
          msg_nonempty: true
      - method: DELETE
        path: /system/role/${EVAL_SPEC003_ASSIGNED_ROLE_ID}
        expect:
          status: 200
          code_not: 200
          msg_nonempty: true
      - method: PUT
        path: /system/role/changeStatus
        body:
          roleId: ${EVAL_SPEC003_ASSIGNED_ROLE_ID}
          status: '1'
        expect:
          status: 200
          code_not: 200
          msg_nonempty: true
      - method: GET
        path: /system/role/1
        expect:
          status: 200
          code: 200
          json:
            data:
              status: '0'
      - method: GET
        path: /system/role/${EVAL_SPEC003_ASSIGNED_ROLE_ID}
        expect:
          status: 200
          code: 200
          json:
            data:
              status: '0'

  # ---------------------------------------------------------------- A-07
  - id: TC-A07
    assertion: A-07
    auth: admin
    input:
      method: GET
      path: /system/menu/list
      query:
        menuName: ${EVAL_SPEC003_MENU_NAME}
    expect:
      status: 200
      code: 200
      data_array_min: 1
      data_contains:
        menuName: ${EVAL_SPEC003_MENU_NAME}
        menuType: M
        status: '0'
    verify:
      - method: GET
        path: /system/menu/treeselect
        expect:
          status: 200
          code: 200
          data_array_min: 1
          data_contains:
            label: ${EVAL_SPEC003_MENU_NAME}

  # ---------------------------------------------------------------- A-08
  - id: TC-A08
    assertion: A-08
    auth: admin
    input:
      method: POST
      path: /system/menu
      body:
        menuName: Spec003 新目录 ${EVAL_RUN_ID}
        parentId: 0
        orderNum: 1
        path: spec003_new_${EVAL_RUN_ID}
        menuType: M
        visible: '0'
        status: '0'
    expect:
      status: 200
      code: 200
    verify:
      - method: GET
        path: /system/menu/list
        query:
          menuName: Spec003 新目录 ${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          data_array_min: 1
        capture:
          DIR_ID: data.0.menuId
      - method: POST
        path: /system/menu
        body:
          menuName: Spec003 新菜单 ${EVAL_RUN_ID}
          parentId: ${DIR_ID}
          orderNum: 1
          path: newchild
          component: system/role/index
          menuType: C
          visible: '0'
          status: '0'
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/menu/list
        query:
          menuName: Spec003 新菜单 ${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          data_array_min: 1
        capture:
          SUB_ID: data.0.menuId
      - method: POST
        path: /system/menu
        body:
          menuName: Spec003 新按钮 ${EVAL_RUN_ID}
          parentId: ${SUB_ID}
          orderNum: 1
          menuType: F
          perms: spec003:new:add
          visible: '0'
          status: '0'
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/menu/list
        query:
          menuName: Spec003 新按钮 ${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          data_array_min: 1
        capture:
          BTN_ID: data.0.menuId
      # 单删含子节点的菜单：HTTP 200 + body code=601
      - method: DELETE
        path: /system/menu/${SUB_ID}
        expect:
          status: 200
          code: 601
          msg_nonempty: true
      # 级联删除必须提交父节点及全部后代 ID（E-12）
      - method: DELETE
        path: /system/menu/cascade/${DIR_ID},${SUB_ID},${BTN_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/menu/list
        query:
          menuName: Spec003 新目录 ${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          arrays_empty:
            - data

  # ---------------------------------------------------------------- A-09
  - id: TC-A09
    assertion: A-09
    auth: menuAdmin
    input:
      method: GET
      path: /system/menu/list
    expect:
      status: 200
      code: 403
      msg: 没有访问权限，请联系管理员授权
    verify:
      - method: POST
        path: /system/menu
        body:
          menuName: Spec003 越权目录 ${EVAL_RUN_ID}
          parentId: 0
          orderNum: 1
          path: spec003_denied_${EVAL_RUN_ID}
          menuType: M
          visible: '0'
          status: '0'
        expect:
          status: 200
          code: 403
          msg: 没有访问权限，请联系管理员授权

  # ---------------------------------------------------------------- A-10
  - id: TC-A10
    assertion: A-10
    auth: admin
    input:
      method: GET
      path: /system/dept/list
      query:
        deptName: ${EVAL_SPEC003_DEPT_NAME}
    expect:
      status: 200
      code: 200
      data_array_min: 1
      data_contains:
        deptName: ${EVAL_SPEC003_DEPT_NAME}
        status: '0'
        parentId: 0
    verify:
      - method: GET
        path: /system/dept/list/exclude/${EVAL_SPEC003_DEPT_ID}
        expect:
          status: 200
          code: 200
          data_array_min: 1
          data_not_contains:
            deptId: ${EVAL_SPEC003_DEPT_ID}
      - method: GET
        path: /system/dept/list/exclude/${EVAL_SPEC003_DEPT_ID}
        expect:
          status: 200
          code: 200
          data_not_contains:
            deptId: ${EVAL_SPEC003_CHILD_DEPT_ID}
      - method: GET
        path: /system/post/deptTree
        expect:
          status: 200
          code: 200
          data_array_min: 1
          data_contains:
            label: ${EVAL_SPEC003_DEPT_NAME}

  # ---------------------------------------------------------------- A-11
  - id: TC-A11
    assertion: A-11
    auth: admin
    input:
      method: POST
      path: /system/dept
      body:
        parentId: ${EVAL_SPEC003_DEPT_ID}
        deptName: Spec003 新子部门 ${EVAL_RUN_ID}
        orderNum: 1
        status: '0'
    expect:
      status: 200
      code: 200
    verify:
      - method: GET
        path: /system/dept/list
        query:
          deptName: Spec003 新子部门 ${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          data_array_min: 1
        capture:
          DEPT_NEW_ID: data.0.deptId
      - method: PUT
        path: /system/dept
        body:
          deptId: ${DEPT_NEW_ID}
          parentId: ${EVAL_SPEC003_DEPT_ID}
          deptName: Spec003 改名部门 ${EVAL_RUN_ID}
          orderNum: 1
          leader: 1
          status: '0'
        expect:
          status: 200
          code: 200
      # 删除含下级的父部门 → 601
      - method: DELETE
        path: /system/dept/${EVAL_SPEC003_DEPT_ID}
        expect:
          status: 200
          code: 601
          msg_nonempty: true
      - method: DELETE
        path: /system/dept/${DEPT_NEW_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/dept/list
        query:
          deptName: Spec003 改名部门 ${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          arrays_empty:
            - data

  # ---------------------------------------------------------------- A-12
  - id: TC-A12
    assertion: A-12
    auth: admin
    input:
      method: POST
      path: /system/post
      body:
        deptId: ${EVAL_SPEC003_DEPT_ID}
        postCode: spec003_new_${EVAL_RUN_ID}
        postName: Spec003 新岗位 ${EVAL_RUN_ID}
        postSort: 1
        status: '0'
    expect:
      status: 200
      code: 200
    verify:
      - method: GET
        path: /system/post/list
        query:
          pageNum: 1
          pageSize: 10
          postCode: spec003_new_${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          total: 1
          rows_contains:
            postCode: spec003_new_${EVAL_RUN_ID}
            deptName: ${EVAL_SPEC003_DEPT_NAME}
        capture:
          POST_NEW_ID: rows.0.postId
      - method: PUT
        path: /system/post
        body:
          postId: ${POST_NEW_ID}
          deptId: ${EVAL_SPEC003_DEPT_ID}
          postCode: spec003_new_${EVAL_RUN_ID}
          postName: Spec003 改名岗位 ${EVAL_RUN_ID}
          postSort: 1
          status: '0'
        expect:
          status: 200
          code: 200
      - method: POST
        path: /system/post/export
        query:
          postCode: spec003_new_${EVAL_RUN_ID}
        expect:
          status: 200
          body_nonempty: true
          content_type_in:
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - application/octet-stream
      # 删除被用户引用的岗位 → 拒绝（E-23）
      - method: DELETE
        path: /system/post/${EVAL_SPEC003_POST_ID}
        expect:
          status: 200
          code_not: 200
          msg_nonempty: true
      - method: DELETE
        path: /system/post/${POST_NEW_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/post/list
        query:
          pageNum: 1
          pageSize: 10
          postCode: spec003_new_${EVAL_RUN_ID}
        expect:
          status: 200
          code: 200
          total: 0
          rows_empty: true

  # ---------------------------------------------------------------- A-18
  # 夹具不预置 spec003_router → spec003_role 的绑定（否则 A-05 的
  # allocatedList.total=0 恒不成立），由本用例自行准备 Given：
  #   1) 重新授予角色的三个菜单——TC-A03 保存角色时只保留目录+子菜单，
  #      会把隐藏菜单的授权覆盖掉；用例不依赖执行顺序，故自行补齐；
  #   2) selectAll 绑定账号；3) 断言；4) cancel 解绑。
  - id: TC-A18
    assertion: A-18
    auth: admin
    input:
      method: PUT
      path: /system/role
      body:
        roleId: ${EVAL_SPEC003_ROLE_ID}
        roleName: ${EVAL_SPEC003_ROLE_NAME}
        roleKey: spec003_role
        roleSort: 1
        status: '0'
        menuIds:
          - ${EVAL_SPEC003_DIR_MENU_ID}
          - ${EVAL_SPEC003_SUB_MENU_ID}
          - ${EVAL_SPEC003_HIDDEN_MENU_ID}
        menuCheckStrictly: false
    expect:
      status: 200
      code: 200
    verify:
      - method: PUT
        path: /system/role/authUser/selectAll
        query:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          userIds: ${EVAL_SPEC003_ROUTER_USER_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/menu/getRouters
        auth: router
        expect:
          status: 200
          code: 200
          data_array_min: 1
          # 已授权目录下：子菜单 visible='0' → hidden=false
          data_contains:
            path: /spec003
            hidden: false
            children:
              - path: menu
                hidden: false
              - path: spec003-hidden
                hidden: true
          # 未授权菜单（系统管理）不出现
          data_not_contains:
            path: /system
      # 收尾解绑，避免污染 A-05 与其他用例
      - method: PUT
        path: /system/role/authUser/cancel
        body:
          roleId: ${EVAL_SPEC003_ROLE_ID}
          userId: ${EVAL_SPEC003_ROUTER_USER_ID}
        expect:
          status: 200
          code: 200
