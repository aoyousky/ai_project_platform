        path: /system/notice/${NEW_NOTICE_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/notice/list
        query:
          noticeTitle: Spec004 公告-A04
        expect:
          status: 200
          code: 200
          total: 0

  # A-05 操作日志：筛选、详情字段、删除、导出
