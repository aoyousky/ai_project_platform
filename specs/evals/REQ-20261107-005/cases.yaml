          status: 200
          code: 200
      - method: GET
        path: /monitor/logininfor/list
        query:
          userName: ${EVAL_SPEC004_LOGIN_USER}
          status: '1'
        expect:
          status: 200
          code: 200
          total: 1
      - method: DELETE
        path: /monitor/logininfor/${EVAL_SPEC004_LOGININFOR_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /monitor/logininfor/list
        query:
          userName: ${EVAL_SPEC004_LOGIN_USER}
          status: '1'
        expect:
          status: 200
          code: 200
          total: 0
      - method: POST
        path: /monitor/logininfor/export
        expect:
          status: 200
          body_nonempty: true
          content_type_in:
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
