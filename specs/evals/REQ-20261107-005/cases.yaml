    expect:
      status: 200
      code: 200
      json:
        data:
          dictId: ${EVAL_SPEC004_DICT_TYPE_ID}
          dictType: ${EVAL_SPEC004_DICT_TYPE}
    verify:
      - method: GET
        path: /system/dict/data/list
        query:
          dictType: ${EVAL_SPEC004_DICT_TYPE}
        expect:
          status: 200
          code: 200
          total: 2
      - method: PUT
        path: /system/dict/data
        body:
          dictCode: ${EVAL_SPEC004_DICT_DATA_A_ID}
          dictType: ${EVAL_SPEC004_DICT_TYPE}
          dictSort: 1
          dictLabel: Spec004 标签一-已改
          dictValue: spec004_value_a
          cssClass: ''
          listClass: primary
          remark: REQ-20261107-005
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/dict/data/${EVAL_SPEC004_DICT_DATA_A_ID}
        expect:
          status: 200
          code: 200
          json:
            data:
              dictCode: ${EVAL_SPEC004_DICT_DATA_A_ID}
              dictLabel: Spec004 标签一-已改
      - method: GET
        path: /system/dict/data/list
        query:
          dictType: ${EVAL_SPEC004_DICT_TYPE}
        expect:
          status: 200
          code: 200
          rows_contains:
            dictCode: ${EVAL_SPEC004_DICT_DATA_A_ID}
            dictLabel: Spec004 标签一-已改

  # A-03 参数设置：筛选、增改删、内置参数删除失败、刷新缓存
  - id: TC-A03
    assertion: A-03
    auth: admin
    input:
      method: GET
      path: /system/config/list
      query:
        configName: ${EVAL_SPEC004_CONFIG_NAME}
        configKey: ${EVAL_SPEC004_CONFIG_KEY}
    expect:
      status: 200
      code: 200
      total: 1
      rows_contains:
        configId: ${EVAL_SPEC004_CONFIG_ID}
        configKey: ${EVAL_SPEC004_CONFIG_KEY}
        configValue: spec004-value-a
    verify:
      - method: POST
        path: /system/config
        body:
          configName: Spec004 新增参数
          configKey: spec004.config.a03
          configValue: a03-value
          configType: N
          remark: REQ-20261107-005
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/config/list
        query:
          configKey: spec004.config.a03
        capture:
          NEW_CONFIG_ID: rows.0.configId
        expect:
          status: 200
          code: 200
          total: 1
          rows_contains:
            configKey: spec004.config.a03
      - method: PUT
        path: /system/config
        body:
          configId: ${NEW_CONFIG_ID}
          configName: Spec004 新增参数
          configKey: spec004.config.a03
          configValue: a03-value-updated
          configType: N
          remark: REQ-20261107-005
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/config/list
        query:
          configKey: spec004.config.a03
        expect:
          status: 200
          code: 200
          total: 1
          rows_contains:
            configId: ${NEW_CONFIG_ID}
            configValue: a03-value-updated
      - method: DELETE
        path: /system/config/${NEW_CONFIG_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/config/list
        query:
          configKey: spec004.config.a03
        expect:
          status: 200
          code: 200
          total: 0
      - method: GET
        path: /system/config/list
        query:
          configKey: sys.oss.previewListResource
        capture:
          PREVIEW_CONFIG_ID: rows.0.configId
        expect:
          status: 200
          code: 200
          total: 1
          rows_contains:
            configKey: sys.oss.previewListResource
            configType: Y
      - method: DELETE
        path: /system/config/${PREVIEW_CONFIG_ID}
        expect:
          status: 200
          code_not: 200
          msg_contains:
            - 内置参数
            - 不能删除
      - method: GET
        path: /system/config/list
        query:
          configKey: sys.oss.previewListResource
        expect:
          status: 200
          code: 200
          total: 1
      - method: PUT
        path: /system/config/updateByKey
        body:
          configKey: ${EVAL_SPEC004_CONFIG_KEY}
          configValue: spec004-value-updated
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/config/configKey/${EVAL_SPEC004_CONFIG_KEY}
        expect:
          status: 200
          code: 200
          json:
            data: spec004-value-updated
      - method: DELETE
        path: /system/config/refreshCache
        expect:
          status: 200
          code: 200

  # A-04 公告：筛选、详情回显、新增、状态同步、删除
