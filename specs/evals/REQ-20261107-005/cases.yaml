    assertion: A-06
    auth: admin
    input:
      method: GET
      path: /monitor/logininfor/list
      query:
        userName: ${EVAL_SPEC004_LOGIN_USER}
        status: '1'
    expect:
      status: 200
      code: 200
      total_min: 1
      rows_contains:
        infoId: ${EVAL_SPEC004_LOGININFOR_ID}
        userName: ${EVAL_SPEC004_LOGIN_USER}
        ipaddr: 127.0.0.1
        loginLocation: 内网IP
        browser: Chrome
        os: Windows
        status: '1'
    verify:
      - method: GET
        path: /monitor/logininfor/unlock/${EVAL_SPEC004_LOGIN_USER}
