        noticeTitle: ${EVAL_SPEC004_NOTICE_TITLE}
        noticeType: '1'
        status: '0'
    verify:
      - method: GET
        path: /system/notice/${EVAL_SPEC004_NOTICE_ID}
        expect:
          status: 200
          code: 200
          json:
            data:
              noticeId: ${EVAL_SPEC004_NOTICE_ID}
              noticeType: '1'
              status: '0'
      - method: POST
        path: /system/notice
        body:
          noticeTitle: Spec004 公告-A04
          noticeType: '1'
          noticeContent: <p>Spec004 A04 正文</p>
          status: '0'
          remark: REQ-20261107-005
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/notice/list
        query:
          noticeTitle: Spec004 公告-A04
        capture:
          NEW_NOTICE_ID: rows.0.noticeId
        expect:
          status: 200
          code: 200
