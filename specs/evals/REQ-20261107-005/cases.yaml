  # A-07 文件：multipart 上传 PNG/TXT、列表、下载、删除
  - id: TC-A07
    assertion: A-07
    auth: admin
    input:
      method: POST
      path: /resource/oss/upload
      formData:
        file:
          path: specs/evals/REQ-20261107-005/fixtures/spec004_upload.png
          contentType: image/png
      capture:
        OSS_PNG_ID: data.ossId
    expect:
      status: 200
      code: 200
      body_nonempty: true
    verify:
      # 同端点两次上传，避开后端 @RepeatSubmit 的 5 秒窗口
      - wait: 5500
      - method: POST
        path: /resource/oss/upload
        formData:
          file:
            path: specs/evals/REQ-20261107-005/fixtures/spec004_upload.txt
            contentType: text/plain
        capture:
          OSS_TXT_ID: data.ossId
        expect:
          status: 200
          code: 200
      - method: GET
        path: /resource/oss/list
        query:
          originalName: spec004_upload
        expect:
          status: 200
          code: 200
          total: 2
          rows_contains_all:
            - originalName: spec004_upload.png
              fileSuffix: .png
              service: minio
              createByName: admin
            - originalName: spec004_upload.txt
              fileSuffix: .txt
              service: minio
              createByName: admin
      - method: GET
        path: /resource/oss/download/${OSS_PNG_ID}
        expect:
          status: 200
          body_nonempty: true
          content_type_in:
            - image/png
            - application/octet-stream
          headers_contains:
            content-disposition: attachment
      - method: DELETE
        path: /resource/oss/${OSS_PNG_ID},${OSS_TXT_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /resource/oss/list
        query:
          originalName: spec004_upload
        expect:
          status: 200
          code: 200
          total: 0

