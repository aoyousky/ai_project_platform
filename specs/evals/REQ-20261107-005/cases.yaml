    assertion: A-05
    auth: admin
    input:
      method: GET
      path: /monitor/operlog/list
      query:
        title: Spec004 操作
        operName: spec004_operator
    expect:
      status: 200
      code: 200
      total_min: 1
      rows_contains:
        operId: ${EVAL_SPEC004_OPER_LOG_ID}
        title: Spec004 操作
        operName: spec004_operator
        operParam: '{"key":"value"}'
        jsonResult: '{"code":200,"msg":"操作成功"}'
