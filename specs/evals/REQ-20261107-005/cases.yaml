# REQ-20261107-005 系统管理辅助模块（SPEC-004 v1.0）
#
# HTTP 可观测部分；UI 专属行为（pageerror、表头、按钮不存在、富文本计算样式）
# 由 frontend/tests/e2e/spec004-assertions.spec.ts 覆盖，并在 Polish 阶段接入。
# 夹具由 scripts/evals/seed_spec004.sh 预置；A-08 结束前恢复 ossConfigId=1 为默认。
spec_version: "1.0"

cases:
  # A-01 字典双栏：类型/数据列表、增改删、受保护类型删除失败
  - id: TC-A01
    assertion: A-01
    auth: admin
    input:
      method: GET
      path: /system/dict/type/list
      query:
        dictType: ${EVAL_SPEC004_DICT_TYPE}
    expect:
      status: 200
      code: 200
      total: 1
      rows_contains:
        dictId: ${EVAL_SPEC004_DICT_TYPE_ID}
        dictName: ${EVAL_SPEC004_DICT_TYPE_NAME}
        dictType: ${EVAL_SPEC004_DICT_TYPE}
    verify:
      - method: GET
        path: /system/dict/data/list
        query:
          dictType: ${EVAL_SPEC004_DICT_TYPE}
        expect:
          status: 200
          code: 200
          total: 2
      - method: POST
        path: /system/dict/data
        body:
          dictType: ${EVAL_SPEC004_DICT_TYPE}
          dictSort: 3
          dictLabel: Spec004 新增标签
          dictValue: spec004_value_c
          cssClass: ''
          listClass: default
          remark: REQ-20261107-005
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/dict/data/list
        query:
          dictType: ${EVAL_SPEC004_DICT_TYPE}
        capture:
          DICT_DATA_NEW_ID: rows.2.dictCode
        expect:
          status: 200
          code: 200
          total: 3
          rows_contains:
            dictLabel: Spec004 新增标签
      - method: PUT
        path: /system/dict/data
        body:
          dictCode: ${DICT_DATA_NEW_ID}
          dictType: ${EVAL_SPEC004_DICT_TYPE}
          dictSort: 3
          dictLabel: Spec004 新增标签-改
          dictValue: spec004_value_c
          cssClass: ''
          listClass: default
          remark: REQ-20261107-005
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/dict/data/list
        query:
          dictType: ${EVAL_SPEC004_DICT_TYPE}
        expect:
          status: 200
          code: 200
          total: 3
          rows_contains:
            dictCode: ${DICT_DATA_NEW_ID}
            dictLabel: Spec004 新增标签-改
      - method: DELETE
        path: /system/dict/data/${DICT_DATA_NEW_ID}
        expect:
          status: 200
          code: 200
      - method: GET
        path: /system/dict/data/list
        query:
          dictType: ${EVAL_SPEC004_DICT_TYPE}
        expect:
          status: 200
          code: 200
          total: 2
      - method: DELETE
        path: /system/dict/type/${EVAL_SPEC004_DICT_TYPE_ID}
        expect:
          status: 200
          code_not: 200
          msg_contains: 已分配,不能删除
      - method: GET
        path: /system/dict/type/list
        query:
          dictType: ${EVAL_SPEC004_DICT_TYPE}
        expect:
          status: 200
          code: 200
          total: 1
      - method: GET
        path: /system/dict/data/list
        query:
          dictType: ${EVAL_SPEC004_DICT_TYPE}
        expect:
          status: 200
          code: 200
          total: 2

  # A-02 隐藏字典数据页数据链路：类型详情 → 数据列表 → 修改 → 回读
