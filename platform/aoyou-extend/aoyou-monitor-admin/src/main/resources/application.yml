server:
  port: 9090
spring:
  application:
    name: aoyou-monitor-admin
  profiles:
    active: @profiles.active@

logging:
  config: classpath:logback-plus.xml

--- # 监控中心服务端配置
spring:
  security:
    user:
      # SPEC-010 §4 / E-03：控制台管理员口令只从环境变量注入，缺失即启动失败；
      # 变量名出现在失败日志里，口令值不打印。
      name: ${MONITOR_ADMIN_USERNAME}
      password: ${MONITOR_ADMIN_PASSWORD}
  boot:
    admin:
      ui:
        title: Aoyou-Vue-Plus服务监控中心
      context-path: /admin
  # 忽略无用警告
  thymeleaf:
    check-template-location: false

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/aoyou-monitor-admin.log

--- # 监控配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: true
  # 设置 Spring Boot Admin Server 地址
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${MONITOR_ADMIN_USERNAME}
  password: ${MONITOR_ADMIN_PASSWORD}
